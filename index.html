<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johnson Form</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f5f7fb;
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(680px, calc(100vw - 2rem));
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }
      h1 { margin-top: 0; }
      p { line-height: 1.5; }
      code {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 0.1rem 0.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Johnson Form is live ✅</h1>
      <p>
        This repository now includes a deployable homepage so Vercel serves a valid route instead of
        <code>404: NOT_FOUND</code>.
      </p>
      <p>If you expected an app, this is the base landing page and can be replaced with your full project.</p>
    </main>
  </body>
</html>
